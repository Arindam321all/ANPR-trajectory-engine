# -----------------------------------------------------------------------------
# City camera network configuration
# -----------------------------------------------------------------------------
# source: path to a video file for demo/testing, or an RTSP/HTTP stream URL
# lat/lon: camera's geographic position (used for the heatmap & map dashboard)
# speed_limit_kmph: posted speed limit on the road segment leaving this camera
# neighbors: cameras this one is directly road-connected to, with the driving
#            distance in km. Used to compute vehicle speed between sightings.
# -----------------------------------------------------------------------------

database:
  path: "city_anpr.db"

detection:
  plate_model_path: "models/plate_yolov8.pt"   # your fine-tuned plate detector
  vehicle_model_path: "yolov8n.pt"             # generic vehicle detector (COCO)
  confidence_threshold: 0.45
  ocr_confidence_threshold: 0.35
  frame_skip: 2          # process every Nth frame (perf tuning)

analytics:
  congestion_window_minutes: 5
  route_congestion:
    # Count thresholds apply to each directed camera-to-camera road segment.
    # A slow segment is promoted one level because it is carrying traffic poorly.
    free_max_vehicles: 2
    light_max_vehicles: 5
    slow_speed_ratio: 0.5       # average speed below 50% of posted limit
  overspeed_tolerance_kmph: 10
  loitering_minutes_threshold: 15
  heatmap_grid_size_deg: 0.002   # ~200m grid cells

cameras:
  - id: CAM_001
    name: "Connaught Place Inner Circle"
    source: "sample_data/cam1.mp4"
    lat: 28.6315
    lon: 77.2167
    speed_limit_kmph: 40

